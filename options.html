<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Polish Anki Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 14px; }
    label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    button { margin-top: 14px; width: 100%; padding: 8px; background: #2b7cff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .status { margin-top: 8px; font-size: 12px; color: #2a2; min-height: 16px; }
  </style>
</head>
<body>
  <h3>Polish Word → Anki</h3>
  <label for="geminiKey">Gemini API-Key</label>
  <input type="password" id="geminiKey" placeholder="AIza..." />

  <label for="deckName">Anki Deck-Name</label>
  <input type="text" id="deckName" placeholder="Polish Vocab" />

  <button id="save">Speichern</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
